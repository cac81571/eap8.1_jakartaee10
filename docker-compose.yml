services:
  eap1:
    build:
      context: .
      dockerfile: Dockerfile
    image: eap81-jakartaee10-sample:latest
    container_name: eap81-jakartaee10-1
    environment:
      JAVA_OPTS_APPEND: "-Djboss.node.name=eap1 -Djboss.bind.address=0.0.0.0 -Djboss.bind.address.management=0.0.0.0"
    expose:
      - "8080"
    ports:
      - "9990:9990"

  eap2:
    image: eap81-jakartaee10-sample:latest
    container_name: eap81-jakartaee10-2
    environment:
      JAVA_OPTS_APPEND: "-Djboss.node.name=eap2 -Djboss.bind.address=0.0.0.0 -Djboss.bind.address.management=0.0.0.0"
    expose:
      - "8080"
    ports:
      - "9991:9990"
    depends_on:
      - eap1

  haproxy:
    image: haproxy:2.9
    container_name: eap81-haproxy
    depends_on:
      - eap1
      - eap2
    ports:
      - "8080:8080"
      - "8404:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
