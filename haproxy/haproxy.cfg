global
  log stdout format raw local0
  maxconn 2048

defaults
  mode http
  log global
  # stdout に出す。backend / server 名で eap1 / eap2 のどちらに振ったか判別できる
  log-format "%ci:%cp [%tr] %ft %b/%[srv_name] %TR/%Tw/%Tc/%Tt %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs {%HM} %HU %HV"
  timeout connect 5s
  timeout client  60s
  timeout server  60s

frontend fe_http
  bind *:8080
  default_backend be_eap

backend be_eap
  balance roundrobin
  http-reuse never
  # 静的 health.html のみプローブ（JSF / index.xhtml は叩かない）
  option httpchk GET /health.html
  http-check expect status 200
  server eap1 eap1:8080 check
  server eap2 eap2:8080 check

frontend fe_stats
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 5s
