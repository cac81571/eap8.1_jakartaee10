global
  log stdout format raw local0
  maxconn 2048

defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client  60s
  timeout server  60s

frontend fe_http
  bind *:8080
  default_backend be_eap

backend be_eap
  balance roundrobin
  option httpchk GET /index.xhtml
  http-check expect status 200
  cookie SRV insert indirect nocache
  server eap1 eap1:8080 check cookie eap1
  server eap2 eap2:8080 check cookie eap2

frontend fe_stats
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 5s
